name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]  # or whatever your "richie" branch is

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup your build environment (e.g., Node.js for frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build  # Replace with your actual build command (e.g., for Richie or your SSG)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'  # or './public', './dist', etc. — wherever your build outputs to

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4